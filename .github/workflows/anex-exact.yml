name: ANEX exact-family diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "src/validate_anex_exact.py"
      - ".github/workflows/anex-exact.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: anex-exact-family
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run ANEX exact family
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python src/validate_anex_exact.py > anex.log 2>&1
          rc=$?
          {
            echo "# ANEX exact-family diagnostic"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            grep -E "^ANEX_" anex.log | tail -n 320
            echo '~~~'
          } > report.md
          gh issue edit 15 --repo "$GITHUB_REPOSITORY" --body-file report.md >/dev/null 2>&1 || true
          cat report.md
          exit "$rc"
