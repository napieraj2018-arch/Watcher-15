name: Automatic browser workspace broker
on:
  push:
    branches:
      - workspace-autostart-broker-20261009
      - ai-browser-cloud
      - broker-strict-provider-identity-20261009
    paths:
      - "workspace_broker/**"
      - ".github/workflows/workspace-broker-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tenant-queue-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate broker syntax
        run: python -m compileall -q workspace_broker
      - name: Run tenant-aware auto-open tests without real accounts
        run: python -m unittest discover -s workspace_broker/tests -v
