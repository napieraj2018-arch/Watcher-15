name: AI Browser saved-close handoff and vault rate-limit regression

on:
  pull_request:
    branches: [ai-browser-cloud]
    paths:
      - durable_tasks.py
      - test_durable_tasks.py
      - .github/workflows/aib-durable-handoff-ci.yml
  push:
    branches: [ai-browser-cloud]
    paths:
      - durable_tasks.py
      - test_durable_tasks.py
      - .github/workflows/aib-durable-handoff-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current MCP and vault crypto dependencies
        run: python -m pip install "mcp[cli]>=2.3,<2.4" "httpx==0.28.1" "cryptography==50.0.0"
      - name: Compile task and ownership guard
        run: python -m py_compile durable_tasks.py session_ownership/multi_capability_guard.py test_durable_tasks.py
      - name: Exercise actual task service, mock vault 429 and watchdog handoff
        env:
          PYTHONPATH: .:session_ownership:session_ownership/tests
        run: python -m unittest test_durable_tasks -v
      - name: Report scope
        run: echo "SYNTHETIC_ONLY_NO_FLOOT_WRITES_NO_STEEL_PROFILES_NO_REAL_LOGINS"
