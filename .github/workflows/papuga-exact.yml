name: Wakacyjna Papuga exact-family proof
on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_papuga_family.py"
      - ".github/workflows/papuga-exact.yml"
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/probe_papuga_family.py
