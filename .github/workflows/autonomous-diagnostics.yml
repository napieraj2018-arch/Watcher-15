name: Autonomous adapter diagnostics

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    paths:
      - "src/validate_exim_exact.py"
      - "src/diagnose_grecos_family.py"
      - "src/probe_grecos_exact_api.py"
      - "src/validate_grecos_exact.py"
      - "src/diagnose_travelplanet_family.py"
      - "src/diagnose_travelplanet_state.py"
      - "src/inspect_travelplanet_js.py"
      - ".github/workflows/autonomous-diagnostics.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: autonomous-adapter-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 2 && contains(github.event.comment.body, '/diagnose'))
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run and publish source diagnostics incrementally
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "# Watcher-15 autonomous diagnostics"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Status: started"
            echo
          } > diagnostic-report.md

          publish() {
            gh issue edit 2 --repo "${GITHUB_REPOSITORY}" --body-file diagnostic-report.md >/dev/null 2>&1 || true
          }

          run_diag() {
            label="$1"
            shift
            out="$(mktemp)"
            timeout 210s "$@" >"$out" 2>&1
            rc=$?
            {
              echo "## ${label}"
              echo
              echo "exit_code: \`${rc}\`"
              echo
              echo '\`\`\`text'
              tail -n 260 "$out"
              echo '\`\`\`'
              echo
            } >> diagnostic-report.md
            rm -f "$out"
            publish
          }

          publish
          run_diag "Grecos exact API" python src/probe_grecos_exact_api.py
          run_diag "EXIM exact family" python src/validate_exim_exact.py
          run_diag "Grecos family" python src/diagnose_grecos_family.py
          run_diag "Grecos exact family" python src/validate_grecos_exact.py
          run_diag "Travelplanet family" python src/diagnose_travelplanet_family.py
          run_diag "Travelplanet state/network" python src/diagnose_travelplanet_state.py
          run_diag "Travelplanet frontend serialization" python src/inspect_travelplanet_js.py

          {
            echo "## Completed"
            echo
            echo "All configured diagnostics finished."
          } >> diagnostic-report.md
          publish
