name: AI Browser mobile workspace UX
on:
  push:
    branches:
      - mobile-browser-shell-20261009
      - ai-browser-cloud
    paths:
      - "ux/mobile/**"
      - ".github/workflows/mobile-workspace-ux.yml"
  workflow_dispatch:
concurrency:
  group: ai-browser-mobile-ux
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chromium-iphone-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install matching Playwright Python client
        run: python -m pip install playwright==1.59.0
      - name: Install Chromium with system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Smoke-test real touch-sized UI and navigation
        run: python -m unittest discover -s ux/mobile/tests -v
      - name: Emit compressed synthetic UI preview for visual QA
        run: |
          python -m pip install pillow
          python ux/mobile/tests/print_demo_preview.py
      - name: Keep screenshots as a review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-browser-mobile-ux-screenshots
          path: ux/mobile/screenshots/
          if-no-files-found: ignore
          retention-days: 7
