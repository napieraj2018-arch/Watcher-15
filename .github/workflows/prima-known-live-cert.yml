name: Prima focused live certification

on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_prima_known_live_recheck.py"
      - ".github/workflows/prima-known-live-cert.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: prima-focused-live-cert
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recheck known Prima family package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python src/probe_prima_known_live_recheck.py > known.log 2>&1
          rc=$?
          {
            echo "# Prima focused live certification"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            grep -E '^PRIMAKNOWN_' known.log | tail -n 220 || true
            echo '~~~'
          } > report.md
          gh issue edit 23 --repo "$GITHUB_REPOSITORY" --body-file report.md >/dev/null 2>&1 || true
          cat report.md
          exit "$rc"
