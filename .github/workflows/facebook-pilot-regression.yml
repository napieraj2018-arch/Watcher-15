name: Facebook pilot offline safety regression
on:
  pull_request:
    paths:
      - 'src/facebook_pilot.py'
      - 'test_facebook_pilot.py'
      - '.github/workflows/facebook-pilot-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test isolated ingestion, no Facebook or account access
        run: |
          python -m py_compile src/facebook_pilot.py test_facebook_pilot.py
          python -m unittest test_facebook_pilot -v
