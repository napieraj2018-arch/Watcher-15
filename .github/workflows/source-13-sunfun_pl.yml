name: Channel 13 — Sun & Fun

on:
  workflow_dispatch:
  schedule:
    - cron: "13,28,43,58 * * * *"
  push:
    paths:
      - "src/sunfun_watcher.py"
      - "src/run_sunfun.py"
      - "config/watchers.json"
      - ".github/workflows/source-13-sunfun_pl.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: source-channel-sunfun_pl
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Sun & Fun exact-family channel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python src/run_sunfun.py
