name: ITAKA diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "src/diagnose_itaka.py"
      - "src/probe_itaka_priority_targets.py"
      - ".github/workflows/itaka-diagnostic.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/diagnose_itaka.py
      - run: python src/probe_itaka_priority_targets.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itaka-diagnostic
          path: itaka-diagnostic.png
          if-no-files-found: ignore
          retention-days: 2
