name: Watcher email notification test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/notification-bot-test.yml

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Create bot test issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue create --repo "$GITHUB_REPOSITORY" --title "BOT TEST Watcher-15 GitHub Actions" --body "@napieraj2018-arch - test utworzony przez GitHub Actions, ta sama sciezka co prawdziwe alerty ofert." --assignee "napieraj2018-arch"
