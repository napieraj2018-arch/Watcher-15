name: Facebook public groups — shared-link route test

on:
  push:
    branches: [feature/facebook-group-access-probe]
    paths:
      - ".github/workflows/facebook-shared-link-route-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-route:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Visit user-shared public-group links read-only
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from urllib.parse import urlsplit
          from playwright.async_api import async_playwright

          urls = [
            ("Spotted Radom", "https://www.facebook.com/share/g/1Eeo2FjxtY/"),
            ("RADOM-OGŁOSZENIA", "https://www.facebook.com/share/g/1De2dACSFU/"),
            ("RADOM-OGŁOSZENIA post", "https://www.facebook.com/groups/158171638326502/posts/2381120366031607/"),
          ]
          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  try:
                      ctx = await browser.new_context(locale="pl-PL")
                      for name, url in urls:
                          page = await ctx.new_page()
                          try:
                              response = await page.goto(url, wait_until="domcontentloaded", timeout=25000)
                              await page.wait_for_timeout(1500)
                              body = (await page.locator("body").inner_text())[:3000].lower()
                              final_path = urlsplit(page.url).path
                              post_links = await page.locator('a[href*="/groups/"][href*="/posts/"]').count()
                              login = "login" in final_path or "zaloguj się do facebooka" in body or "log in to facebook" in body
                              print(f"ROUTE {name}: status={response.status if response else 0} final_path={final_path} login={login} post_links={post_links}")
                          except Exception as exc:
                              print(f"ROUTE {name}: error_type={type(exc).__name__}")
                          finally:
                              await page.close()
                      await ctx.close()
                  finally:
                      await browser.close()
          asyncio.run(main())
          PY
