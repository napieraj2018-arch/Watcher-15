name: Channel 02 — TUI Poland

on:
  workflow_dispatch:
  push:
    paths:
      - "src/watcher.py"
      - "src/channel_runner.py"
      - "config/watchers.json"
      - "config/channels.json"
      - ".github/workflows/source-02-tui_pl.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: source-channel-tui_pl
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run TUI Poland channel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          WATCHER_CHANNEL: tui_pl
        run: python src/channel_runner.py
