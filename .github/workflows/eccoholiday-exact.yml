name: Ecco Holiday exact-family diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "src/validate_eccoholiday_exact.py"
      - "src/inspect_eccoholiday_schema.py"
      - "src/probe_eccoholiday_total_control.py"
      - "src/probe_eccoholiday_pair_browser.py"
      - ".github/workflows/eccoholiday-exact.yml"

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe Ecco Holiday family schema
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python src/inspect_eccoholiday_schema.py > ecco-schema.log 2>&1
          rcs=$?
          python src/validate_eccoholiday_exact.py > ecco.log 2>&1
          rc=$?
          python src/probe_eccoholiday_total_control.py > ecco-control.log 2>&1
          rcc=$?
          python src/probe_eccoholiday_pair_browser.py > ecco-pair.log 2>&1
          rcp=$?
          {
            echo "# Ecco Holiday exact-family diagnostic"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            grep -E '^ECCO_' ecco.log | tail -n 380 || true
            echo
            echo "## Total-price control"
            grep -E '^ECCOCTRL_' ecco-control.log | tail -n 420 || true
            echo
            echo "## Browser 2+2 vs 2+0 control"
            grep -E '^ECCOPAIR_' ecco-pair.log | tail -n 420 || true
            echo
            echo "## JS/search schema"
            grep -E '^ECCOSCHEMA_' ecco-schema.log | tail -n 420 || true
            echo '~~~'
          } > report.md
          gh issue edit 28 --repo "$GITHUB_REPOSITORY" --body-file report.md >/dev/null 2>&1 || true
          cat report.md
          if [ "$rcs" -ne 0 ]; then exit "$rcs"; fi
          if [ "$rcp" -ne 0 ]; then exit "$rcp"; fi
          exit "$rc"
