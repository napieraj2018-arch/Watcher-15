name: Dynamic picker inspector

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/inspect_dynamic_picker.py'
      - '.github/workflows/dynamic-picker-inspect.yml'

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        channel: [fly_pl, nekera_pl, oasis_pl]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          CHANNEL_ID: ${{ matrix.channel }}
        run: python src/inspect_dynamic_picker.py
