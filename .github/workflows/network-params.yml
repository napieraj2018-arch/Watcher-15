name: Booking network parameter diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - "src/diagnose_network_params.py"
      - ".github/workflows/network-params.yml"
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        source: [exim, travelplanet, grecos]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          DIAG_SOURCE: ${{ matrix.source }}
        run: python src/diagnose_network_params.py
