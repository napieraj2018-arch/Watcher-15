name: Prima live certification

on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_prima_live_cert.py"
      - ".github/workflows/prima-live-cert.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: prima-live-certification
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Certify Prima exact family
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout 300s python src/probe_prima_live_cert.py > cert.log 2>&1
          rc=$?
          {
            echo "# Prima live exact-family certification"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            grep -E '^PRIMACERT_' cert.log | tail -n 220 || true
            echo '~~~'
          } > report.md
          gh issue edit 23 --repo "$GITHUB_REPOSITORY" --body-file report.md >/dev/null 2>&1 || true
          cat report.md
          exit "$rc"
