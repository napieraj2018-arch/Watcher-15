name: Facebook Radom Watcher — pilot 15 min

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: facebook-local-monitor-production
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.FB_WATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      FB_WATCH_STATE: ".fb-monitor/state.json"
      GITHUB_TOKEN: ${{ github.token }}
      FB_GITHUB_ISSUE_ALERTS: ${{ vars.FB_GITHUB_ISSUE_ALERTS }}
      FB_GITHUB_ASSIGNEE: "napieraj2018-arch"
      SMTP_HOST: ${{ secrets.FB_SMTP_HOST }}
      SMTP_PORT: ${{ secrets.FB_SMTP_PORT }}
      SMTP_USER: ${{ secrets.FB_SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.FB_SMTP_PASSWORD }}
      ALERT_TO: ${{ secrets.FB_ALERT_TO }}
    steps:
      - name: Checkout only approved sources
        uses: actions/checkout@v4

      - name: Verify that an alert channel is explicitly configured
        id: readiness
        shell: bash
        run: |
          if [ "$FB_GITHUB_ISSUE_ALERTS" = "true" ] || { [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$ALERT_TO" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Monitoring not enabled: configure a private SMTP route or opt into public GitHub Issue alerts."
          fi

      - name: Restore deduplication state
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ".fb-monitor/state.json"
          key: facebook-public-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            facebook-public-v1-

      - name: Install Playwright Chromium for public page previews
        if: steps.readiness.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Read-only monitor (never clicks or comments on Facebook)
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set +e
          python -u -m src.facebook_local_monitor
          code=$?
          set -e
          echo "$code" > .facebook_monitor_exit
          echo "MONITOR_EXIT_CODE=$code"

      - name: Persist hashed links only
        if: steps.readiness.outputs.ready == 'true' && hashFiles('.fb-monitor/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ".fb-monitor/state.json"
          key: facebook-public-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report failure when sources or alerts do not work
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          code=$(cat .facebook_monitor_exit)
          if [ "$code" != 0 ]; then
            echo "::error::Monitor failed or alert was not delivered. See source status above."
            exit "$code"
          fi
