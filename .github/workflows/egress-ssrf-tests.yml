name: Browser tenant outbound SSRF policy checks
on:
  push:
    branches:
      - commercial-egress-ssrf-20261009
    paths:
      - "commercial/egress_policy.py"
      - "commercial/tests/test_egress_policy.py"
      - ".github/workflows/egress-ssrf-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-network-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and offline navigation policy checks
        run: |
          python -m py_compile commercial/egress_policy.py commercial/tests/test_egress_policy.py
          python -m unittest discover -s commercial/tests -p 'test_egress_policy.py' -v
