name: Channel 06 — Travelplanet

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    paths:
      - "src/travelplanet_watcher.py"
      - "src/channel_runner.py"
      - "config/channels.json"
      - "config/watchers.json"
      - ".github/workflows/source-06-travelplanet_pl.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: source-channel-travelplanet_pl
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run Travelplanet production channel and publish smoke result
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          WATCHER_CHANNEL: travelplanet_pl
        run: |
          set +e
          python src/channel_runner.py > travelplanet-run.log 2>&1
          rc=$?
          {
            echo "# Travelplanet production smoke"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            tail -n 300 travelplanet-run.log
            echo '~~~'
          } > travelplanet-smoke.md
          gh issue edit 10 --repo "$GITHUB_REPOSITORY" --body-file travelplanet-smoke.md >/dev/null 2>&1 || true
          cat travelplanet-run.log
          exit "$rc"
