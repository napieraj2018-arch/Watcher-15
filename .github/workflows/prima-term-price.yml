name: Prima live term price

on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_prima_termprice.py"
      - ".github/workflows/prima-term-price.yml"

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare live term prices
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout 300s python src/probe_prima_termprice.py > term.log 2>&1
          rc=$?
          {
            echo "# Prima live term-price proof"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            grep -E '^PRIMATERM_' term.log | tail -n 520 || true
            echo '~~~'
          } > report.md
          gh issue edit 24 --repo "$GITHUB_REPOSITORY" --body-file report.md >/dev/null 2>&1 || true
          cat report.md
          exit "$rc"
