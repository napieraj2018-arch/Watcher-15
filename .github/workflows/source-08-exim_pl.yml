name: Channel 08 — EXIM tours

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"
  push:
    paths:
      - "src/exim_watcher.py"
      - "src/channel_runner.py"
      - "config/channels.json"
      - "config/watchers.json"
      - ".github/workflows/source-08-exim_pl.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: source-channel-exim_pl
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run EXIM production channel and publish smoke result
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          WATCHER_CHANNEL: exim_pl
        run: |
          set +e
          python src/channel_runner.py > exim-run.log 2>&1
          rc=$?
          {
            echo "# EXIM production smoke"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- exit_code: \`${rc}\`"
            echo
            echo '\`\`\`text'
            tail -n 220 exim-run.log
            echo '\`\`\`'
          } > exim-smoke.md
          gh issue edit 4 --repo "${GITHUB_REPOSITORY}" --body-file exim-smoke.md >/dev/null 2>&1 || true
          cat exim-run.log
          exit "$rc"
