name: Prima flight offer bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_prima_flight_offer.py"
      - ".github/workflows/prima-flight-offer.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: prima-flight-offer
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve live flight offers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout 180s python src/probe_prima_flight_offer.py > flight.log 2>&1
          rc=$?
          {
            echo "# Prima flight offer bridge"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            grep -E "^PRIMAFLIGHT_" flight.log | tail -n 700 || true
            echo '~~~'
          } > report.md
          gh issue edit 24 --repo "$GITHUB_REPOSITORY" --body-file report.md >/dev/null 2>&1 || true
          cat report.md
          exit "$rc"
