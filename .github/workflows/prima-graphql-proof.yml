name: Prima GraphQL family-total proof

on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_prima_graphql.py"
      - ".github/workflows/prima-graphql-proof.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: prima-graphql-family-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Prima GraphQL proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout 180s python src/probe_prima_graphql.py > prima-gql.log 2>&1
          rc=$?
          {
            echo "# Prima Holiday GraphQL family-total proof"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            grep -E "^PRIMAGQL_" prima-gql.log | tail -n 320 || true
            echo '~~~'
          } > report.md
          gh issue edit 20 --repo "$GITHUB_REPOSITORY" --body-file report.md >/dev/null 2>&1 || true
          cat report.md
          exit "$rc"
