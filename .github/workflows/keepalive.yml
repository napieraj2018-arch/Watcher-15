name: Watcher keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep scheduled workflows active
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .watcher-heartbeat
          git config user.name "watcher-15"
          git config user.email "watcher-15@users.noreply.github.com"
          git add .watcher-heartbeat
          git commit -m "Keep Watcher-15 active" || exit 0
          git push
