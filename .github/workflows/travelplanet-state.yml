name: Travelplanet state diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/diagnose_travelplanet_state.py'
      - '.github/workflows/travelplanet-state.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/diagnose_travelplanet_state.py
