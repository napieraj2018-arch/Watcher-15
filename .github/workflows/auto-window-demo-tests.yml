name: AI Browser automatic-window demo tests
on:
  push:
    branches:
      - browser-auto-window-demo-20261009
      - ai-browser-cloud
      - auto-window-webkit-csrf-20261009
    paths:
      - "ux/connected/**"
      - "workspace_broker/**"
      - "ux/mobile/workspace.js"
      - ".github/workflows/auto-window-demo-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-auto-window-demo
  cancel-in-progress: true
jobs:
  browser-integrated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local Chromium test dependencies
        run: python -m pip install playwright==1.59.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test automatic open and queue through real Chromium
        run: python -m unittest discover -s ux/connected/tests -v
      - name: Re-run original mobile interaction regressions
        run: python -m unittest discover -s ux/mobile/tests -v
      - name: Re-run tenant-aware broker regressions
        run: python -m unittest discover -s workspace_broker/tests -v
  webkit-iphone-like-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install WebKit client and browser
        run: |
          python -m pip install playwright==1.59.0
          python -m playwright install --with-deps webkit
      - name: Check mobile browser UX, queue and WebKit compatibility
        run: python -m unittest discover -s ux/connected/webkit_tests -v
