name: EXIM exact 2+2 validation
on:
  workflow_dispatch:
  push:
    paths:
      - "src/validate_exim_exact.py"
      - ".github/workflows/exim-exact.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/validate_exim_exact.py
