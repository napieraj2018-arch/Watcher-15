name: AI Browser vendor cost quota proof
on:
  push:
    branches:
      - commercial-usage-cap-20261009
    paths:
      - "commercial/usage_guard/**"
      - ".github/workflows/commercial-usage-guard.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ephemeral-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start local PostgreSQL 16 on disposable CI runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16
          # LOOPBACK-only trust is permitted only in this disposable CI runner.
          sudo sed -i '1i host all all 127.0.0.1/32 trust' /etc/postgresql/16/main/pg_hba.conf
          sudo pg_ctlcluster 16 main restart
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<3.3"
      - name: Apply only to disposable test Postgres
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f commercial/usage_guard/001_vendor_budget.sql
      - name: Test tenant budgets, replay, settlements and overages
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f commercial/usage_guard/tests/test_budget.sql
      - name: Race sixteen independent connections
        run: python commercial/usage_guard/tests/test_concurrent.py
      - name: Confirm no Stripe or Steel activity
        run: echo "OFFLINE_PROOF_ONLY_NO_LIVE_BILLING_NO_BROWSER"
