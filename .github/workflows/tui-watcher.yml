name: Legacy TUI watcher (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run legacy TUI watcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          WATCHER_PROVIDER: tui_pl
        run: python src/watcher.py
