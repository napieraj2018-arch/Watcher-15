name: Rego-Bis exact-family diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "src/validate_regobis_exact.py"
      - "src/inspect_regobis_js.py"
      - "src/probe_regobis_assets.py"
      - ".github/workflows/regobis-exact.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: regobis-exact-family
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Rego-Bis exact-family diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python src/probe_regobis_assets.py > rego-deep.log 2>&1
          rcdeep=$?
          python src/inspect_regobis_js.py > rego-js.log 2>&1
          rcjs=$?
          python src/validate_regobis_exact.py > rego.log 2>&1
          rc=$?
          {
            echo "# Rego-Bis exact-family diagnostic"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            grep -E "^REGO_" rego.log | tail -n 360 || true
            echo
            echo "## Focused bundle schema"
            grep -E "^REGODEEP_(FILE|URL|SNIP)" rego-deep.log | tail -n 320 || true
            echo
            echo "## JS schema"
            grep -E "^REGOJS_" rego-js.log | tail -n 160 || true
            echo '~~~'
          } > report.md
          gh issue edit 13 --repo "$GITHUB_REPOSITORY" --body-file report.md >/dev/null 2>&1 || true
          cat report.md
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if [ "$rcdeep" -ne 0 ]; then exit "$rcdeep"; fi
          exit "$rcjs"
