name: Facebook Watcher — bot issue email test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/facebook-local-monitor
    paths:
      - ".github/workflows/facebook-alert-delivery-test.yml"

permissions:
  issues: write
  contents: read

jobs:
  test-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create bot-authored issue assigned to owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh issue create --repo "$GH_REPO" \
            --title "BOT TEST — Facebook Watcher, test powiadomienia e-mail" \
            --body "@napieraj2018-arch — To jednorazowy test powiadomienia Facebook Watcher. Zgloszenie tworzy github-actions[bot], jak we wczesniej dzialajacym tescie #44. Nie zawiera danych z Facebooka ani prywatnych informacji." \
            --assignee "napieraj2018-arch"
