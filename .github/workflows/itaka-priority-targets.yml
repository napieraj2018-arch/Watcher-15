name: ITAKA priority exact-family targets

on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_itaka_priority_targets.py"
      - ".github/workflows/itaka-priority-targets.yml"

permissions:
  contents: read

concurrency:
  group: itaka-priority-targets
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          PYTHONUNBUFFERED: "1"
        run: python src/probe_itaka_priority_targets.py
