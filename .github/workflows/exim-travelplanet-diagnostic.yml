name: EXIM Travelplanet deep diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "src/diagnose_exim_travelplanet.py"
      - ".github/workflows/exim-travelplanet-diagnostic.yml"

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        channel: [exim_pl, travelplanet_pl]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnose
        env:
          CHANNEL_ID: ${{ matrix.channel }}
        run: python src/diagnose_exim_travelplanet.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-${{ matrix.channel }}
          path: diag-${{ matrix.channel }}.png
          if-no-files-found: ignore
          retention-days: 2
