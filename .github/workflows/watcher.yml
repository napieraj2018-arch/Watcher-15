name: Watcher 15

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "src/watcher.py"
      - "config/watchers.json"
      - ".github/workflows/watcher.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: watcher-15
  cancel-in-progress: false

jobs:
  watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Watcher-15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python src/watcher.py
