name: Watcher 15

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnostic — Wakacje.pl participant picker
        run: python src/diagnose_wakacje.py

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wakacje-diagnostic
          path: |
            wakacje-diagnostic.png
            wakacje-diagnostic.html
          if-no-files-found: ignore
          retention-days: 2
