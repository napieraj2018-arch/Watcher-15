name: Browser session ownership checks
on:
  push:
    branches:
      - session-ownership-guard-20261008
    paths:
      - "session_ownership/**"
      - ".github/workflows/ai-browser-session-guard-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install matching controller test dependencies
        run: python -m pip install "mcp[cli]>=2.3,<2.4" "starlette>=0.40,<1" "httpx>=0.28,<1"
      - name: Compile candidate
        run: python -m compileall -q session_ownership
      - name: Run offline tests without credentials
        working-directory: session_ownership
        run: python -m unittest discover -s tests -v
