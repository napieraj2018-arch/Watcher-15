name: SunFun result inspector

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/inspect_sunfun_results.py'
      - '.github/workflows/sunfun-result-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/inspect_sunfun_results.py
