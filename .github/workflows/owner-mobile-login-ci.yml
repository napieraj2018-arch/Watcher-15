name: AI Browser owner-scoped mobile login — security CI
on:
  pull_request:
    paths:
      - "session_ownership/owner_mobile_handoff.py"
      - "session_ownership/owner_mobile_touch.py"
      - "session_ownership/multi_capability_guard.py"
      - "steel_runtime.py"
      - "durable_tasks.py"
      - "meta_command.py"
      - "test_meta_command.py"
      - "connector_router.py"
      - "mcp_error_reporting.py"
      - "test_mcp_error_reporting.py"
      - "test_durable_tasks.py"
      - "test_steel_captcha.py"
      - "auth_status_v052.py"
      - "verification_status.py"
      - "test_verification_status.py"
      - "steel_context_fix.py"
      - "history_navigation.py"
      - "test_history_navigation.py"
      - "test_history_navigation_chromium.py"
      - "test_owner_mobile_handoff.py"
      - "test_owner_mobile_touch.py"
      - "test_owner_mobile_touch_chromium.py"
      - "test_owner_mobile_touch_webkit.py"
      - "test_owner_parallel_mcp.py"
      - "Dockerfile"
      - ".github/workflows/owner-mobile-login-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production-compatible MCP and HTTP dependencies
        run: python -m pip install "mcp[cli]>=2.3,<2.4" "starlette>=0.40,<1" "httpx>=0.28,<1"
      - name: Verify original guard and scoped mobile handoff
        env:
          PYTHONPATH: ".:session_ownership:session_ownership/tests"
        run: |
          python -m py_compile steel_runtime.py session_ownership/owner_mobile_handoff.py session_ownership/owner_mobile_touch.py session_ownership/multi_capability_guard.py test_owner_mobile_handoff.py test_owner_mobile_touch.py test_owner_mobile_touch_chromium.py
          python -m unittest test_owner_mobile_touch test_owner_mobile_handoff test_owner_parallel_mcp -v
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime with owner-scoped login and lifecycle tests
        run: docker build --progress=plain -t ai-browser-owner-mobile .
      - name: Verify scoped HTTP controls and real Chromium and WebKit behavior
        run: |
          docker run --rm --entrypoint sh ai-browser-owner-mobile -c "PYTHONPATH=/app/session_ownership:/app python /app/test_owner_mobile_handoff.py && PYTHONPATH=/app/session_ownership:/app python /app/test_owner_mobile_touch.py"
          mkdir -p mobile-ux-artifacts
          aib_browser_checks_failed=0
          docker run --rm --network none --entrypoint sh ai-browser-owner-mobile -c "PYTHONPATH=/app/session_ownership:/app python /app/test_owner_mobile_touch_chromium.py" || aib_browser_checks_failed=1
          docker run --rm --network none -e AIB_MOBILE_UX_ARTIFACTS=/artifacts -v "$PWD/mobile-ux-artifacts:/artifacts" --entrypoint sh ai-browser-owner-mobile -c "PYTHONPATH=/app/session_ownership:/app python /app/test_owner_mobile_touch_webkit.py" || aib_browser_checks_failed=1
          docker run --rm --network none --entrypoint sh ai-browser-owner-mobile -c "PYTHONPATH=/app/session_ownership:/app python /app/test_history_navigation_chromium.py" || aib_browser_checks_failed=1
          test "$aib_browser_checks_failed" -eq 0
          echo "OFFLINE_TESTS_ONLY_NO_ACCOUNTS_NO_STEEL_NO_DEPLOY"
      - name: Keep synthetic iPhone screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-mobile-login-iphone
          path: mobile-ux-artifacts/
          if-no-files-found: error
          retention-days: 14
