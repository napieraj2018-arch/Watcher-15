name: AI Browser owner-scoped mobile login — security CI
on:
  pull_request:
    paths:
      - "session_ownership/owner_mobile_handoff.py"
      - "session_ownership/owner_mobile_touch.py"
      - "session_ownership/multi_capability_guard.py"
      - "steel_runtime.py"
      - "test_owner_mobile_handoff.py"
      - "test_owner_mobile_touch.py"
      - "test_owner_parallel_mcp.py"
      - "Dockerfile"
      - ".github/workflows/owner-mobile-login-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production-compatible MCP and HTTP dependencies
        run: python -m pip install "mcp[cli]>=2.3,<2.4" "starlette>=0.40,<1" "httpx>=0.28,<1"
      - name: Verify original guard and scoped mobile handoff
        env:
          PYTHONPATH: ".:session_ownership:session_ownership/tests"
        run: |
          python -m py_compile steel_runtime.py session_ownership/owner_mobile_handoff.py session_ownership/owner_mobile_touch.py session_ownership/multi_capability_guard.py test_owner_mobile_handoff.py test_owner_mobile_touch.py
          python -m unittest test_owner_mobile_touch test_owner_mobile_handoff test_owner_parallel_mcp -v
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Build the unchanged runtime with owner-scoped login tests
        run: docker build --progress=plain -t ai-browser-owner-mobile .
      - name: Verify 51 existing MCP tools plus four scoped HTTP routes
        run: |
          docker run --rm --entrypoint sh ai-browser-owner-mobile -c "PYTHONPATH=/app/session_ownership:/app python /app/test_owner_mobile_handoff.py && PYTHONPATH=/app/session_ownership:/app python /app/test_owner_mobile_touch.py"
          echo "OFFLINE_TESTS_ONLY_NO_ACCOUNTS_NO_STEEL_NO_DEPLOY"
