name: Oasis exact-family diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_oasis_party.py"
      - "src/probe_oasis_confirm.py"
      - "src/probe_oasis_api.py"
      - "src/probe_oasis_compare.py"
      - "src/validate_oasis_exact.py"
      - ".github/workflows/oasis-exact.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: oasis-exact-family
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Compare Oasis family and adults totals
        continue-on-error: true
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 160s python src/probe_oasis_compare.py > oasis-compare.log 2>&1

      - name: Probe Oasis direct API fallback
        continue-on-error: true
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 35s python src/probe_oasis_api.py > oasis-api.log 2>&1

      - name: Publish compact Oasis report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Oasis exact-family / BlueVendo diagnostic"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '~~~text'
            echo "## Family vs adults total"
            if [ -f oasis-compare.log ]; then grep -E "^OASISCMP_" oasis-compare.log | tail -n 220 || true; fi
            echo
            echo "## Direct API fallback"
            if [ -f oasis-api.log ]; then grep -E "^OASIS_API_" oasis-api.log | tail -n 140 || true; fi
            echo '~~~'
          } > report.md
          gh issue edit 7 --repo "$GITHUB_REPOSITORY" --body-file report.md
          cat report.md
