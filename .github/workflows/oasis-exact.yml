name: Oasis exact-family diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_oasis_party.py"
      - "src/probe_oasis_confirm.py"
      - "src/validate_oasis_exact.py"
      - ".github/workflows/oasis-exact.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: oasis-exact-family
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe Oasis participant DOM
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: python src/probe_oasis_confirm.py > oasis-focus.log 2>&1
      - name: Publish compact Oasis report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Oasis focused participant diagnostic"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '~~~text'
            grep -E "^OASIS2_" oasis-focus.log | tail -n 180
            echo '~~~'
          } > report.md
          gh issue edit 7 --repo "$GITHUB_REPOSITORY" --body-file report.md
          cat report.md
