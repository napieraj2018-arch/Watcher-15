name: Oasis exact-family diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "src/validate_oasis_exact.py"
      - "src/inspect_secondary_js.py"
      - ".github/workflows/oasis-exact.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: oasis-exact-family
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Oasis exact family
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_ID: oasis_pl
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python src/validate_oasis_exact.py > oasis.log 2>&1
          rc=$?
          {
            echo "# Oasis exact-family diagnostic"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- exit_code: $rc"
            echo
            echo '```text'
            tail -n 360 oasis.log
            echo '```'
          } > report.md
          gh issue edit 7 --repo "$GITHUB_REPOSITORY" --body-file report.md >/dev/null 2>&1 || true
          cat oasis.log
          exit "$rc"
