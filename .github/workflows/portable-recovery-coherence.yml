name: Portable profile recovery coherence
on:
  push:
    branches:
      - profile-recovery-coherence-20261008
    paths:
      - "steel_context_fix.py"
      - "test_profile_recovery_051.py"
      - "test_portable_precedence.py"
      - "test_portable_precedence_chromium.py"
      - ".github/workflows/portable-recovery-coherence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-compatibility-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile steel_context_fix.py test_profile_recovery_051.py test_portable_precedence.py
      - run: python -m unittest test_profile_recovery_051 test_portable_precedence -v
  chromium-state-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container: mcr.microsoft.com/playwright/python:v1.59.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Python browser-client dependencies
        run: python -m pip install playwright==1.59.0 httpx==0.28.1 starlette
      - name: Verify real Chromium state across restart
        run: python test_portable_precedence_chromium.py
