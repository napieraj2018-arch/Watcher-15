name: Channel 11 — Grecos

on:
  workflow_dispatch:
  schedule:
    - cron: "5,20,35,50 * * * *"
  push:
    paths:
      - "src/grecos_watcher.py"
      - "src/channel_runner.py"
      - "config/channels.json"
      - "config/watchers.json"
      - ".github/workflows/source-11-grecos_pl.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: source-channel-grecos_pl
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run Grecos production channel and publish smoke result
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          WATCHER_CHANNEL: grecos_pl
        run: |
          set +e
          python src/channel_runner.py > grecos-run.log 2>&1
          rc=$?
          {
            echo "# Grecos production smoke"
            echo
            echo "- commit: `$GITHUB_SHA`"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- exit_code: `$rc`"
            echo
            echo '```text'
            tail -n 260 grecos-run.log
            echo '```'
          } > grecos-smoke.md
          gh issue edit 5 --repo "$GITHUB_REPOSITORY" --body-file grecos-smoke.md >/dev/null 2>&1 || true
          cat grecos-run.log
          exit "$rc"
