name: TUI diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "src/diagnose_tui.py"
      - ".github/workflows/tui-diagnostic.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/diagnose_tui.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-diagnostic
          path: tui-diagnostic.png
          if-no-files-found: ignore
          retention-days: 2
