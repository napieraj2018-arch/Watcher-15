name: Best Reisen fast family proof

on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_bestreisen_fastcalc.py"
      - ".github/workflows/bestreisen-fast.yml"

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/probe_bestreisen_fastcalc.py
