name: YouTube OAuth backend and owner handoff regression
on:
  pull_request:
    branches: [ai-browser-cloud]
    paths:
      - youtube_oauth.py
      - test_youtube_oauth.py
      - youtube_oauth_handoff.py
      - test_youtube_oauth_handoff.py
      - .github/workflows/youtube-oauth-ci.yml
  push:
    branches: [repair/youtube-oauth-20261024]
    paths:
      - youtube_oauth.py
      - test_youtube_oauth.py
      - youtube_oauth_handoff.py
      - test_youtube_oauth_handoff.py
      - .github/workflows/youtube-oauth-ci.yml
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx==0.28.1 cryptography==46.0.4 starlette==0.48.0
      - run: python -m unittest -v test_youtube_oauth test_youtube_oauth_handoff
