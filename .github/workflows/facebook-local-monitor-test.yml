name: Facebook Local Monitor — test (no login, no posting)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/facebook-local-monitor
    paths:
      - "src/facebook_local_monitor.py"
      - "src/facebook_monitor_ai_browser.py"
      - "src/facebook_notify.py"
      - "config/facebook_local_monitor.json"
      - "tests/test_facebook_local_monitor.py"
      - "tests/test_facebook_monitor_ai_browser.py"
      - "tests/test_facebook_notify.py"
      - ".github/workflows/facebook-local-monitor-test.yml"

permissions:
  contents: read

concurrency:
  group: facebook-local-monitor-diagnostic
  cancel-in-progress: false

jobs:
  tests-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -p 'test_facebook*.py' -v

      - name: Verify first baseline and repeated scan safely
        shell: bash
        env:
          FB_WATCH_STATE: ".fb-probe-state/seen.json"
        run: |
          python -u -m src.facebook_local_monitor
          python -u -m src.facebook_local_monitor
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path(".fb-probe-state/seen.json").read_text())
          assert state["version"] == 1
          assert len(state["hashes"]) >= 2, "Expected baseline of at least 2 public posts"
          print("BASELINE_TEST_OK count=" + str(len(state["hashes"])))
          PY

      - name: One-time diagnostic on the two public Radom pages
        shell: bash
        env:
          FB_PROBE_META: "1"
        run: |
          set +e
          python -u src/facebook_local_monitor.py --probe
          code=$?
          set -e
          echo "FACEBOOK_PROBE_EXIT=$code"
          if [ "$code" = 3 ]; then
            echo "::warning::Facebook content inaccessible or no identifiable posts. This is NOT an operational monitor."
            exit 0
          fi
          exit "$code"
