name: Family surface diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/diagnose_family_surface.py'
      - 'config/channels.json'
      - '.github/workflows/family-surface.yml'

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        channel: [fly_pl, sunfun_pl, nekera_pl, oasis_pl]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnose family controls
        env:
          CHANNEL_ID: ${{ matrix.channel }}
        run: python src/diagnose_family_surface.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-surface-${{ matrix.channel }}
          path: family-surface-${{ matrix.channel }}.png
          if-no-files-found: ignore
          retention-days: 2
