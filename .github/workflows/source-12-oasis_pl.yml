name: Channel 12 — Oasis Tours

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-channel-oasis_pl
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Oasis Tours channel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          WATCHER_CHANNEL: oasis_pl
        run: python src/channel_runner.py
