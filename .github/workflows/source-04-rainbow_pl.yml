name: Channel 04 — Rainbow

on:
  workflow_dispatch:
  push:
    paths:
      - "src/watcher.py"
      - "src/channel_runner.py"
      - "config/watchers.json"
      - "config/channels.json"
      - ".github/workflows/source-04-rainbow_pl.yml"
  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: source-channel-rainbow_pl
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Rainbow channel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          WATCHER_CHANNEL: rainbow_pl
        run: python src/channel_runner.py
