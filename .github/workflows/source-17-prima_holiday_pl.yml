name: Channel 17 — Prima Holiday

on:
  workflow_dispatch:
  schedule:
    - cron: "11,26,41,56 * * * *"
  push:
    paths:
      - "src/prima_watcher.py"
      - "src/channel_runner.py"
      - "config/channels.json"
      - "config/watchers.json"
      - ".github/workflows/source-17-prima_holiday_pl.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: source-channel-prima_holiday_pl
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Prima Holiday production channel
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          WATCHER_CHANNEL: prima_holiday_pl
        run: |
          set +e
          python src/channel_runner.py > prima-run.log 2>&1
          rc=$?
          {
            echo "# Prima Holiday production smoke"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            grep -E '^(CHANNEL_|PRIMA_PROD_)' prima-run.log | tail -n 360 || true
            echo '~~~'
          } > prima-smoke.md
          gh issue edit 23 --repo "$GITHUB_REPOSITORY" --body-file prima-smoke.md >/dev/null 2>&1 || true
          cat prima-run.log
          exit "$rc"
