name: Channel health

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  push:
    paths:
      - "config/channels.json"
      - "src/channel_health.py"
      - ".github/workflows/channel-health.yml"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/channel_health.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-health
          path: channel-health.json
          if-no-files-found: ignore
          retention-days: 7
