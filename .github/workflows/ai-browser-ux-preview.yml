name: AI Browser human-first window UX
on:
  push:
    branches:
      - aib-human-browser-window-20261009
    paths:
      - "ux-preview/**"
      - ".github/workflows/ai-browser-ux-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-ux-tests:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.59.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright Python
        run: python -m pip install --no-cache-dir playwright==1.59.0
      - name: Run smartphone and desktop browser interaction checks
        run: python -m unittest discover -s ux-preview/tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-browser-ux-preview-screenshots
          path: |
            /tmp/ai-browser-ux-mobile.png
            /tmp/ai-browser-ux-desktop.png
          if-no-files-found: ignore
          retention-days: 7
