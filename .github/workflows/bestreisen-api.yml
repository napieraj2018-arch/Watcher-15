name: Best Reisen API exact-family control

on:
  workflow_dispatch:
  push:
    paths:
      - "src/probe_bestreisen_api.py"
      - ".github/workflows/bestreisen-api.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: bestreisen-api-family
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe Best Reisen API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout 240s python src/probe_bestreisen_api.py > api.log 2>&1
          rc=$?
          {
            echo "# Best Reisen API exact-family control"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- exit_code: $rc"
            echo
            echo '~~~text'
            grep -E '^BESTAPI_' api.log | tail -n 420 || true
            echo '~~~'
          } > report.md
          gh issue edit 21 --repo "$GITHUB_REPOSITORY" --body-file report.md >/dev/null 2>&1 || true
          cat report.md
          exit "$rc"
